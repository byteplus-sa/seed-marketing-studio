<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{stylesheet}}">
</head>
<body class="{{ratio_class}}">
<main class="canvas layout-problem-solution">
{{plate}}
<div class="safe">
<header class="brand"><img class="logo" src="{{logo_src}}" alt="{{brand_name}}"></header>
<section class="copy">
<p class="eyebrow" data-copy-key="problem">{{problem}}</p>
<h1 class="headline" data-copy-key="headline">{{headline}}</h1>
<ul class="claims">{{claims}}</ul>
</section>
<figure class="product"><img src="{{product_src}}" alt="{{product_name}}"></figure>
<footer class="action"><p class="cta" data-copy-key="cta">{{cta}}</p></footer>
</div>
</main>
</body>
</html>
